<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealStreets — Featured Story Builder</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a14;
            color: #e8e8f0;
            min-height: 100vh;
        }
        .visitor-view {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        .visitor-header {
            background: #16181f;
            padding: 1rem;
            text-align: center;
            border-bottom: 2px solid #f0c040;
            margin-bottom: 2rem;
        }
        .admin-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        .admin-btn, .login-btn {
            background: #f0c040;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-overlay.hide { display: none; }
        .login-box {
            background: #16181f;
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
        }
        .login-box input {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
        }
        .editor-view {
            display: none;
            padding: 20px;
        }
        .toolbox {
            position: fixed;
            left: 20px;
            top: 100px;
            width: 200px;
            background: #16181f;
            padding: 15px;
            border-radius: 12px;
        }
        .drag-item {
            background: #2a2d38;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: grab;
            text-align: center;
        }
        .canvas {
            margin-left: 240px;
            min-height: 500px;
            padding: 20px;
            background: #0d0d14;
            border-radius: 12px;
        }
        .block {
            background: #16181f;
            border: 2px solid #2a2d38;
            border-radius: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        .block.selected { border-color: #f0c040; }
        .block-controls {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 5px;
        }
        .block-controls button {
            background: #e63946;
            border: none;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
        }
        .edit-block {
            background: #f0c040 !important;
            color: #000 !important;
        }
        .block-content { padding: 15px; }
        .rank-item {
            background: #0a0a14;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
        }
        button {
            background: #f0c040;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            padding: 50px;
            overflow-y: auto;
        }
        .modal.active { display: block; }
        .modal-content {
            background: #16181f;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 16px;
        }
        .rank-editor-item {
            background: #0a0a14;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
        }
        .rank-editor-item input, .rank-editor-item textarea {
            width: 100%;
            margin: 5px 0;
            padding: 8px;
            background: #1a1c26;
            border: 1px solid #2a2d38;
            color: white;
            border-radius: 6px;
        }
        #quill-editor { height: 300px; background: white; color: black; margin-bottom: 20px; }
    </style>
</head>
<body>

<!-- Visitor View -->
<div id="visitorView">
    <div class="visitor-header">
        <h1 style="color:#f0c040;">DealStreets // Featured Story</h1>
        <button class="login-btn" onclick="showLogin()">🔐 Admin</button>
        <a href="https://dealstreets.xyz"><button>← Back to Promos</button></a>
    </div>
    <div id="visitorContent" class="visitor-view"></div>
</div>

<!-- Login Overlay -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h2>Admin Login</h2>
        <input type="password" id="adminPassword" placeholder="Enter master code">
        <button onclick="checkLogin()">Login</button>
    </div>
</div>

<!-- Editor View -->
<div id="editorView" class="editor-view">
    <div class="toolbox">
        <h3>Blocks</h3>
        <div class="drag-item" draggable="true" data-type="text">📝 Text Block</div>
        <div class="drag-item" draggable="true" data-type="image">🖼️ Image Block</div>
        <div class="drag-item" draggable="true" data-type="ranked">🏆 Ranked List</div>
        <button onclick="saveDraft()">💾 Save Draft</button>
        <button onclick="publishStory()">⭐ Publish</button>
        <button onclick="logout()">🚪 Logout</button>
    </div>
    <div class="canvas" id="canvas" droppable="true"></div>
</div>

<!-- Ranked Editor Modal -->
<div id="rankedModal" class="modal">
    <div class="modal-content">
        <h3>Edit Ranked List</h3>
        <div id="rankedEditorContent"></div>
        <button onclick="saveRankedEdit()">Save</button>
        <button onclick="closeRankedModal()">Cancel</button>
    </div>
</div>

<!-- Text Editor Modal -->
<div id="textModal" class="modal">
    <div class="modal-content">
        <h3>Edit Text</h3>
        <div id="quill-editor"></div>
        <button onclick="saveTextEdit()">Save</button>
        <button onclick="closeTextModal()">Cancel</button>
    </div>
</div>

<script>
    const MASTER_CODE = 'DealStreetsMaster2025!';
    let boxes = [];
    let nextId = 1;
    let selectedBlockId = null;
    let currentEditId = null;
    let currentRankedData = null;
    let quill = null;
    let sortable = null;

    // Helper
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }

    // Render visitor view
    function renderVisitor() {
        const container = document.getElementById('visitorContent');
        const saved = localStorage.getItem('blogBuilder_published');
        let publishedBoxes = [];
        if (saved) {
            const data = JSON.parse(saved);
            publishedBoxes = data.boxes || [];
        }
        
        if (publishedBoxes.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:50px;">No featured story yet. Check back soon!</div>';
            return;
        }
        
        container.innerHTML = publishedBoxes.map(box => {
            if (box.type === 'text') {
                return `<div class="block"><div class="block-content">${box.content || ''}</div></div>`;
            } else if (box.type === 'image') {
                return `<div class="block"><div class="block-content"><img src="${box.content}" style="max-width:100%; border-radius:8px;"></div></div>`;
            } else if (box.type === 'ranked' && box.rankedData) {
                const data = box.rankedData;
                let itemsHtml = '';
                if (data.items) {
                    itemsHtml = data.items.map(item => `
                        <div class="rank-item">
                            <strong style="color:#f0c040;">#${item.rank} ${escapeHtml(item.title)}</strong>
                            ${item.deal ? `<span style="background:#e63946; padding:2px 8px; border-radius:20px; font-size:12px;">${escapeHtml(item.deal)}</span>` : ''}
                            ${item.image ? `<div><img src="${escapeHtml(item.image)}" style="max-width:100%; border-radius:8px; margin:10px 0;"></div>` : ''}
                            <p>${escapeHtml(item.description)}</p>
                        </div>
                    `).join('');
                }
                return `
                    <div class="block">
                        <div class="block-content">
                            ${data.bannerImage ? `<img src="${data.bannerImage}" style="width:100%; border-radius:12px;">` : ''}
                            ${data.openingStatement ? `<p style="background:rgba(240,192,64,0.1); padding:15px; border-left:4px solid #f0c040;">${escapeHtml(data.openingStatement)}</p>` : ''}
                            <h3 style="color:#f0c040;">The List</h3>
                            ${itemsHtml}
                            ${data.conclusion ? `<div style="background:rgba(240,192,64,0.1); padding:15px; border-radius:12px; margin-top:20px;">${escapeHtml(data.conclusion)}</div>` : ''}
                        </div>
                    </div>
                `;
            }
            return '';
        }).join('');
    }

    // Render editor canvas
    function renderEditor() {
        const canvas = document.getElementById('canvas');
        if (boxes.length === 0) {
            canvas.innerHTML = '<div style="text-align:center; padding:50px; color:#666;">Drag blocks here from the left toolbox</div>';
            return;
        }
        
        canvas.innerHTML = boxes.map(box => {
            let contentHtml = '';
            if (box.type === 'text') {
                contentHtml = `<div class="block-content">${box.content || '<p><em>Click edit to add content</em></p>'}</div>`;
            } else if (box.type === 'image') {
                contentHtml = `<div class="block-content"><img src="${box.content}" style="max-width:100%;"></div>`;
            } else if (box.type === 'ranked' && box.rankedData) {
                const data = box.rankedData;
                let previewHtml = `<div class="block-content"><strong>🏆 Ranked List (Top ${data.rankCount || 10})</strong><br>${data.openingStatement ? data.openingStatement.substring(0, 100) + '...' : 'Click edit to configure'}</div>`;
                contentHtml = previewHtml;
            }
            
            return `
                <div class="block ${selectedBlockId === box.id ? 'selected' : ''}" data-id="${box.id}" data-type="${box.type}" style="width:${box.width || 400}px;">
                    <div class="block-controls">
                        <button class="edit-block" onclick="editBlock(${box.id})">✎</button>
                        <button onclick="deleteBlock(${box.id})">✕</button>
                    </div>
                    ${contentHtml}
                </div>
            `;
        }).join('');
        
        // Re-attach drag events for sorting
        if (sortable) sortable.destroy();
        sortable = new Sortable(canvas, {
            animation: 200,
            onEnd: () => {
                const newOrder = [];
                document.querySelectorAll('#canvas .block').forEach(el => {
                    const id = parseInt(el.dataset.id);
                    const found = boxes.find(b => b.id === id);
                    if (found) newOrder.push(found);
                });
                if (newOrder.length === boxes.length) boxes = newOrder;
            }
        });
    }

    // Edit block
    function editBlock(id) {
        const box = boxes.find(b => b.id === id);
        if (!box) return;
        currentEditId = id;
        
        if (box.type === 'text') {
            if (!quill) {
                quill = new Quill('#quill-editor', {
                    theme: 'snow',
                    modules: { toolbar: [['bold', 'italic', 'underline'], [{ 'color': [] }, { 'background': [] }], [{ 'list': 'ordered'}, { 'list': 'bullet' }]] }
                });
            }
            quill.root.innerHTML = box.content || '';
            document.getElementById('textModal').classList.add('active');
        } else if (box.type === 'image') {
            const newUrl = prompt('Enter image URL:', box.content);
            if (newUrl !== null) {
                box.content = newUrl;
                renderEditor();
            }
        } else if (box.type === 'ranked') {
            currentRankedData = box.rankedData || { rankCount: 5, bannerImage: '', openingStatement: '', items: [], conclusion: '' };
            if (!currentRankedData.items || currentRankedData.items.length === 0) {
                currentRankedData.items = [];
                for (let i = currentRankedData.rankCount; i >= 1; i--) {
                    currentRankedData.items.push({ rank: i, title: `Item ${i}`, deal: '', image: '', description: '' });
                }
            }
            renderRankedModal();
            document.getElementById('rankedModal').classList.add('active');
        }
    }
    
    function renderRankedModal() {
        const container = document.getElementById('rankedEditorContent');
        const data = currentRankedData;
        
        let itemsHtml = '';
        for (let i = data.rankCount; i >= 1; i--) {
            const item = data.items.find(it => it.rank === i) || { rank: i, title: '', deal: '', image: '', description: '' };
            itemsHtml += `
                <div class="rank-editor-item">
                    <strong>#${i}</strong>
                    <input type="text" id="rank_title_${i}" placeholder="Title" value="${escapeHtml(item.title)}">
                    <input type="text" id="rank_deal_${i}" placeholder="Deal/Price" value="${escapeHtml(item.deal)}">
                    <input type="text" id="rank_image_${i}" placeholder="Image URL" value="${escapeHtml(item.image)}">
                    <textarea id="rank_desc_${i}" rows="2" placeholder="Description">${escapeHtml(item.description)}</textarea>
                </div>
            `;
        }
        
        container.innerHTML = `
            <label>Number of Items:</label>
            <select id="rankCount" onchange="changeRankCount()">
                <option value="3" ${data.rankCount === 3 ? 'selected' : ''}>Top 3</option>
                <option value="5" ${data.rankCount === 5 ? 'selected' : ''}>Top 5</option>
                <option value="10" ${data.rankCount === 10 ? 'selected' : ''}>Top 10</option>
            </select>
            <label>Banner Image URL:</label>
            <input type="text" id="rankBanner" value="${escapeHtml(data.bannerImage)}" style="width:100%; padding:8px;">
            <label>Opening Statement:</label>
            <textarea id="rankOpening" rows="3" style="width:100%;">${escapeHtml(data.openingStatement)}</textarea>
            ${itemsHtml}
            <label>Conclusion:</label>
            <textarea id="rankConclusion" rows="3" style="width:100%;">${escapeHtml(data.conclusion)}</textarea>
        `;
    }
    
    function changeRankCount() {
        const newCount = parseInt(document.getElementById('rankCount').value);
        currentRankedData.rankCount = newCount;
        const existingItems = currentRankedData.items || [];
        const newItems = [];
        for (let i = newCount; i >= 1; i--) {
            const existing = existingItems.find(it => it.rank === i);
            newItems.push({
                rank: i,
                title: existing?.title || `Item ${i}`,
                deal: existing?.deal || '',
                image: existing?.image || '',
                description: existing?.description || ''
            });
        }
        currentRankedData.items = newItems;
        renderRankedModal();
    }
    
    function saveRankedEdit() {
        const newCount = parseInt(document.getElementById('rankCount').value);
        const newItems = [];
        for (let i = newCount; i >= 1; i--) {
            newItems.push({
                rank: i,
                title: document.getElementById(`rank_title_${i}`)?.value || '',
                deal: document.getElementById(`rank_deal_${i}`)?.value || '',
                image: document.getElementById(`rank_image_${i}`)?.value || '',
                description: document.getElementById(`rank_desc_${i}`)?.value || ''
            });
        }
        
        currentRankedData = {
            rankCount: newCount,
            bannerImage: document.getElementById('rankBanner')?.value || '',
            openingStatement: document.getElementById('rankOpening')?.value || '',
            items: newItems,
            conclusion: document.getElementById('rankConclusion')?.value || ''
        };
        
        const box = boxes.find(b => b.id === currentEditId);
        if (box) {
            box.rankedData = currentRankedData;
            renderEditor();
        }
        closeRankedModal();
    }
    
    function saveTextEdit() {
        if (quill && currentEditId) {
            const box = boxes.find(b => b.id === currentEditId);
            if (box) {
                box.content = quill.root.innerHTML;
                renderEditor();
            }
        }
        closeTextModal();
    }
    
    function deleteBlock(id) {
        boxes = boxes.filter(b => b.id !== id);
        if (selectedBlockId === id) selectedBlockId = null;
        renderEditor();
    }
    
    // Drag and drop
    document.querySelectorAll('.drag-item').forEach(item => {
        item.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', JSON.stringify({ type: item.dataset.type }));
        });
    });
    
    const canvas = document.getElementById('canvas');
    canvas.addEventListener('dragover', (e) => e.preventDefault());
    canvas.addEventListener('drop', (e) => {
        e.preventDefault();
        const rawData = e.dataTransfer.getData('text/plain');
        if (!rawData) return;
        const { type } = JSON.parse(rawData);
        
        let newBox = null;
        if (type === 'text') {
            newBox = { id: nextId++, type: 'text', width: 400, content: '<h2>New Text Block</h2><p>Click ✎ to edit</p>' };
        } else if (type === 'image') {
            newBox = { id: nextId++, type: 'image', width: 400, content: 'https://picsum.photos/400/250' };
        } else if (type === 'ranked') {
            newBox = { 
                id: nextId++, 
                type: 'ranked', 
                width: 450, 
                rankedData: {
                    rankCount: 5,
                    bannerImage: '',
                    openingStatement: 'Here are my top picks!',
                    items: [
                        { rank: 5, title: 'Item 5', deal: '', image: '', description: 'Description for #5' },
                        { rank: 4, title: 'Item 4', deal: '', image: '', description: 'Description for #4' },
                        { rank: 3, title: 'Item 3', deal: '', image: '', description: 'Description for #3' },
                        { rank: 2, title: 'Item 2', deal: '', image: '', description: 'Description for #2' },
                        { rank: 1, title: 'Item 1', deal: '', image: '', description: 'Description for #1' }
                    ],
                    conclusion: 'Thanks for reading!'
                }
            };
        }
        
        if (newBox) {
            boxes.push(newBox);
            renderEditor();
        }
    });
    
    // Save and publish
    function saveDraft() {
        localStorage.setItem('blogBuilder_draft', JSON.stringify({ boxes, nextId }));
        alert('✅ Draft saved!');
    }
    
    function publishStory() {
        localStorage.setItem('blogBuilder_published', JSON.stringify({ boxes, nextId }));
        alert('⭐ Published! Visitors will now see this story.');
        renderVisitor();
    }
    
    function loadDraft() {
        const saved = localStorage.getItem('blogBuilder_draft');
        if (saved) {
            const data = JSON.parse(saved);
            boxes = data.boxes || [];
            nextId = data.nextId || 10;
        } else {
            // Default demo
            boxes = [
                { id: nextId++, type: 'text', width: 400, content: '<h1 style="color:#f0c040;">🔥 Welcome to Featured Story</h1><p>Drag blocks from the left to build your story. Click Publish when ready!</p>' },
                { id: nextId++, type: 'ranked', width: 450, rankedData: {
                    rankCount: 5,
                    bannerImage: '',
                    openingStatement: 'Check out these amazing deals!',
                    items: [
                        { rank: 5, title: 'Budget Pick', deal: '$20 off', image: '', description: 'Great value for money.' },
                        { rank: 4, title: 'Staff Favorite', deal: '30% off', image: '', description: 'Highly recommended.' },
                        { rank: 3, title: 'Top Seller', deal: 'Buy 1 Get 1', image: '', description: 'Most popular item.' },
                        { rank: 2, title: 'Editors Choice', deal: '$50 off', image: '', description: 'Excellent quality.' },
                        { rank: 1, title: 'Best Overall', deal: '40% off + Free Ship', image: '', description: 'The best deal this month.' }
                    ],
                    conclusion: 'Don\'t miss out on these offers!'
                }}
            ];
        }
        renderEditor();
    }
    
    // Login functions
    function showLogin() {
        document.getElementById('loginOverlay').classList.remove('hide');
    }
    
    function checkLogin() {
        const pwd = document.getElementById('adminPassword').value;
        if (pwd === MASTER_CODE) {
            document.getElementById('loginOverlay').classList.add('hide');
            document.getElementById('visitorView').style.display = 'none';
            document.getElementById('editorView').style.display = 'block';
            loadDraft();
        } else {
            alert('Invalid password');
        }
    }
    
    function logout() {
        document.getElementById('visitorView').style.display = 'block';
        document.getElementById('editorView').style.display = 'none';
        renderVisitor();
    }
    
    function closeRankedModal() {
        document.getElementById('rankedModal').classList.remove('active');
        currentEditId = null;
    }
    
    function closeTextModal() {
        document.getElementById('textModal').classList.remove('active');
        currentEditId = null;
    }
    
    // Make functions global
    window.editBlock = editBlock;
    window.deleteBlock = deleteBlock;
    window.saveDraft = saveDraft;
    window.publishStory = publishStory;
    window.showLogin = showLogin;
    window.checkLogin = checkLogin;
    window.logout = logout;
    window.saveRankedEdit = saveRankedEdit;
    window.closeRankedModal = closeRankedModal;
    window.saveTextEdit = saveTextEdit;
    window.closeTextModal = closeTextModal;
    window.changeRankCount = changeRankCount;
    
    // Initialize
    renderVisitor();
</script>
</body>
</html>
